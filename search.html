<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث - AI Art Gallery</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1040/1040247.png">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <nav>
           <div class="logo"> مــــعــــرض أثـــــــــر</div>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="gallery.html">المعرض</a></li>
                <li><a href="search.html" class="active">بحث</a></li>
                <li><a href="about.html">عن المعرض</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="gallery-container">
            <h2>بحث في المعرض</h2>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن عمل فني...">
                <button id="searchBtn">بحث</button>
            </div>
            
            <div class="mood-filters">
                <button class="filter-btn active" data-mood="all">الكل</button>
                <button class="filter-btn" data-mood="هادئ">هادئ</button>
                <button class="filter-btn" data-mood="سعيد">سعيد</button>
                <button class="filter-btn" data-mood="حزين">حزين</button>
                <button class="filter-btn" data-mood="غامض">غامض</button>
            </div>
            
            <div id="resultCount" style="text-align: center; margin: 1rem 0; font-size: 0.95rem; color: #8b5e3c;"></div>
            <div class="gallery-grid" id="searchResults">
                <div class="loading">جاري التحميل...</div>
            </div>
        </div>
    </main>

    <footer>
        <p>لكل لوحة قصة لا تُقال.</p>
    </footer>

   <script src="https://SoftwereEngenOMBettol.github.io/art-gallery/js/main.js"></script>
</body>
</html>
